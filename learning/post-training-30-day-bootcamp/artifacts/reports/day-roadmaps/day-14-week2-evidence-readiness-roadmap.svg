  <rect width="1800" height="2840" fill="#f5f7fb"/>
  <text x="50" y="62" class="title">Day 14 · Week 2 Evidence → Qwen3.5 Readiness</text>
  <text x="50" y="95" class="subtitle">“合法选择 none”也是实验完成；但 v1 方法闭环不会自动让新模型 ready。</text>
  <rect x="1190" y="108" width="570" height="38" rx="19" class="status-info"/>
  <text x="1475" y="133" class="stage" text-anchor="middle">ROADMAP RECONSTRUCTED · WEEK 2 EVIDENCE VERIFIED</text>

  <rect x="40" y="165" width="1720" height="112" rx="18" class="hero"/>
  <text x="70" y="203" class="section">一句话 Gate</text>
  <text x="270" y="203" class="label" text-anchor="start"><tspan x="270" dy="0">Claim → Evidence → Alternative explanation → Limit：每个结论都要写出证据对象和不能外推的部分。</tspan><tspan x="270" dy="31">Week 2 证明的是 v1 方法链有效；M0–M6 任一缺少 v2 专属证据，都必须阻止正式 SFT 或下游训练。</tspan></text>

  <rect x="40" y="310" width="1720" height="650" rx="18" class="panel"/>
  <text x="70" y="352" class="section">1 · Roadmap：从输入边界到可交付结论</text>
  <text x="70" y="382" class="small">每一步都回答“对象是什么、证据在哪里、失败时停在哪一层”；编号代表依赖顺序。</text>
  <text x="70" y="391" class="stage">01 · DAY 08</text>
<rect x="70" y="405" width="360" height="210" rx="16" class="blue"/>
<text x="94" y="445" class="label" text-anchor="start"><tspan x="94" dy="0">冻结数据契约</tspan></text>
<line x1="94" y1="463" x2="406" y2="463" class="divider"/>
<text x="94" y="497" class="small" text-anchor="start"><tspan x="94" dy="0">raw → render → tokens → labels</tspan><tspan x="94" dy="28">attention mask ≠ loss mask</tspan><tspan x="94" dy="28">截断后再次做 encoded gate</tspan></text>
<text x="480" y="391" class="stage">02 · DAY 09</text>
<rect x="480" y="405" width="360" height="210" rx="16" class="cyan"/>
<text x="504" y="445" class="label" text-anchor="start"><tspan x="504" dy="0">冻结 lineage</tspan></text>
<line x1="504" y1="463" x2="816" y2="463" class="divider"/>
<text x="504" y="497" class="small" text-anchor="start"><tspan x="504" dy="0">source / license / revision / hashes</tspan><tspan x="504" dy="28">用 supervised tokens 描述 mixture</tspan><tspan x="504" dy="28">等监督预算 ≠ 等 forward compute</tspan></text>
<text x="890" y="391" class="stage">03 · DAY 10</text>
<rect x="890" y="405" width="360" height="210" rx="16" class="purple"/>
<text x="914" y="445" class="label" text-anchor="start"><tspan x="914" dy="0">训练前冻结量尺</tspan></text>
<line x1="914" y1="463" x2="1226" y2="463" class="divider"/>
<text x="914" y="497" class="small" text-anchor="start"><tspan x="914" dy="0">suite / prompt / decoder / scorer</tspan><tspan x="914" dy="28">Base baseline 早于任何 candidate</tspan><tspan x="914" dy="28">dev 与 sealed confirmation 分开</tspan></text>
<text x="1300" y="391" class="stage">04 · DAY 11</text>
<rect x="1300" y="405" width="360" height="210" rx="16" class="green"/>
<text x="1324" y="445" class="label" text-anchor="start"><tspan x="1324" dy="0">证明 pipeline 能学</tspan></text>
<line x1="1324" y1="463" x2="1636" y2="463" class="divider"/>
<text x="1324" y="497" class="small" text-anchor="start"><tspan x="1324" dy="0">tiny overfit + fresh resume</tspan><tspan x="1324" dy="28">按有效 target 聚合 loss</tspan><tspan x="1324" dy="28">通过不等于泛化</tspan></text>
<text x="280" y="676" class="stage">05 · DAY 12</text>
<rect x="280" y="690" width="360" height="210" rx="16" class="amber"/>
<text x="304" y="730" class="label" text-anchor="start"><tspan x="304" dy="0">接受 no-candidate</tspan></text>
<line x1="304" y1="748" x2="616" y2="748" class="divider"/>
<text x="304" y="782" class="small" text-anchor="start"><tspan x="304" dy="0">联合 gate 先于排名</tspan><tspan x="304" dy="28">0 eligible 是合法终点</tspan><tspan x="304" dy="28">不能从失败项中手选最好</tspan></text>
<text x="720" y="676" class="stage">06 · PORT METHODS</text>
<rect x="720" y="690" width="360" height="210" rx="16" class="teal"/>
<text x="744" y="730" class="label" text-anchor="start"><tspan x="744" dy="0">只迁移方法证据</tspan></text>
<line x1="744" y1="748" x2="1056" y2="748" class="divider"/>
<text x="744" y="782" class="small" text-anchor="start"><tspan x="744" dy="0">raw IDs / audit / scorer semantics</tspan><tspan x="744" dy="28">旧 token、score、checkpoint 留在 v1</tspan><tspan x="744" dy="28">明确 alternative explanations</tspan></text>
<text x="1160" y="676" class="stage">07 · OPEN M0–M6</text>
<rect x="1160" y="690" width="360" height="210" rx="16" class="indigo"/>
<text x="1184" y="730" class="label" text-anchor="start"><tspan x="1184" dy="0">建立 v2 readiness</tspan></text>
<line x1="1184" y1="748" x2="1496" y2="748" class="divider"/>
<text x="1184" y="782" class="small" text-anchor="start"><tspan x="1184" dy="0">lineage → revision → runtime</tspan><tspan x="1184" dy="28">processor/data/eval → training/capacity</tspan><tspan x="1184" dy="28">candidate set → fail-closed promotion</tspan></text>
  <path d="M 430 510 L 470 510" class="line"/>
<path d="M 840 510 L 880 510" class="line"/>
<path d="M 1250 510 L 1290 510" class="line"/>
<path d="M 1660 615 C 1660 650 1520 650 1520 680" class="line-dash"/>
<path d="M 640 795 L 710 795" class="line"/>
<path d="M 1080 795 L 1150 795" class="line"/>

  <rect x="40" y="990" width="1720" height="590" rx="18" class="panel"/>
  <text x="70" y="1033" class="section">2 · 真正学到的知识：可迁移的判断框架</text>
  <rect x="70" y="1075" width="530" height="205" rx="16" class="blue-soft"/>
<circle cx="106" cy="1114" r="18" class="number-dot"/>
<text x="106" y="1120" class="number" text-anchor="middle">1</text>
<text x="136" y="1120" class="label" text-anchor="start"><tspan x="136" dy="0">监督语义先于训练</tspan></text>
<text x="96" y="1161" class="small" text-anchor="start"><tspan x="96" dy="0">先证明哪些 token 产生 CE、由哪个 logit</tspan><tspan x="96" dy="27">预测，再讨论 loss 曲线。</tspan></text>
<rect x="635" y="1075" width="530" height="205" rx="16" class="purple-soft"/>
<circle cx="671" cy="1114" r="18" class="number-dot"/>
<text x="671" y="1120" class="number" text-anchor="middle">2</text>
<text x="701" y="1120" class="label" text-anchor="start"><tspan x="701" dy="0">Mixture 有多个分母</tspan></text>
<text x="661" y="1161" class="small" text-anchor="start"><tspan x="661" dy="0">examples、input tokens、supervised tokens</tspan><tspan x="661" dy="27">回答不同问题，不能互换。</tspan></text>
<rect x="1200" y="1075" width="530" height="205" rx="16" class="green-soft"/>
<circle cx="1236" cy="1114" r="18" class="number-dot"/>
<text x="1236" y="1120" class="number" text-anchor="middle">3</text>
<text x="1266" y="1120" class="label" text-anchor="start"><tspan x="1266" dy="0">Baseline 必须早于 candidate</tspan></text>
<text x="1226" y="1161" class="small" text-anchor="start"><tspan x="1226" dy="0">训练后再改 prompt、parser 或 scorer，</tspan><tspan x="1226" dy="27">就失去纵向比较的因果边界。</tspan></text>
<rect x="70" y="1310" width="530" height="205" rx="16" class="amber-soft"/>
<circle cx="106" cy="1349" r="18" class="number-dot"/>
<text x="106" y="1355" class="number" text-anchor="middle">4</text>
<text x="136" y="1355" class="label" text-anchor="start"><tspan x="136" dy="0">Tiny overfit 是系统测试</tspan></text>
<text x="96" y="1396" class="small" text-anchor="start"><tspan x="96" dy="0">它证明 mask、gradient、optimizer、resume；</tspan><tspan x="96" dy="27">不证明真实 recipe 或未见数据能力。</tspan></text>
<rect x="635" y="1310" width="530" height="205" rx="16" class="cyan-soft"/>
<circle cx="671" cy="1349" r="18" class="number-dot"/>
<text x="671" y="1355" class="number" text-anchor="middle">5</text>
<text x="701" y="1355" class="label" text-anchor="start"><tspan x="701" dy="0">None 是一等公民</tspan></text>
<text x="661" y="1396" class="small" text-anchor="start"><tspan x="661" dy="0">selection policy 必须允许零候选，</tspan><tspan x="661" dy="27">否则实验会被迫产出错误 checkpoint。</tspan></text>
<rect x="1200" y="1310" width="530" height="205" rx="16" class="slate-soft"/>
<circle cx="1236" cy="1349" r="18" class="number-dot"/>
<text x="1236" y="1355" class="number" text-anchor="middle">6</text>
<text x="1266" y="1355" class="label" text-anchor="start"><tspan x="1266" dy="0">Held-out 是消耗品</tspan></text>
<text x="1226" y="1396" class="small" text-anchor="start"><tspan x="1226" dy="0">只在规则允许的时点查看一次；</tspan><tspan x="1226" dy="27">未消费状态本身也是重要证据。</tspan></text>

  <rect x="40" y="1610" width="1720" height="720" rx="18" class="panel"/>
  <text x="70" y="1653" class="section">3 · Evidence：关键数字、对照与决策依据</text>
  <rect x="70" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="94" y="1724" class="stage" text-anchor="start"><tspan x="94" dy="0">DAY 08 CONTRACT</tspan></text>
<text x="94" y="1769" class="metric-value" text-anchor="start"><tspan x="94" dy="0">20 / 20 golden</tspan></text>
<text x="94" y="1802" class="tiny" text-anchor="start"><tspan x="94" dy="0">10 accept · 8 schema · 2 encoded reject</tspan></text>
<rect x="480" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="504" y="1724" class="stage" text-anchor="start"><tspan x="504" dy="0">DAY 09 CLEAN POOL</tspan></text>
<text x="504" y="1769" class="metric-value" text-anchor="start"><tspan x="504" dy="0">7,860 records</tspan></text>
<text x="504" y="1802" class="tiny" text-anchor="start"><tspan x="504" dy="0">2,774,246 supervised tokens</tspan></text>
<rect x="890" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="914" y="1724" class="stage" text-anchor="start"><tspan x="914" dy="0">DAY 10 MEASURE</tspan></text>
<text x="914" y="1769" class="metric-value" text-anchor="start"><tspan x="914" dy="0">112 dev · 48 sealed</tspan></text>
<text x="914" y="1802" class="tiny" text-anchor="start"><tspan x="914" dy="0">Base 15/112 · Code 0/28</tspan></text>
<rect x="1300" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="1324" y="1724" class="stage" text-anchor="start"><tspan x="1324" dy="0">DAY 11–12 DECISION</tspan></text>
<text x="1324" y="1769" class="metric-value" text-anchor="start"><tspan x="1324" dy="0">98.89% → 0 eligible</tspan></text>
<text x="1324" y="1802" class="tiny" text-anchor="start"><tspan x="1324" dy="0">pipeline pass；checkpoint promotion none</tspan></text>
  <rect x="70" y="1860" width="1660" height="297" rx="12" class="table-bg"/>
<rect x="70" y="1860" width="1660" height="52" rx="12" class="table-head"/>
<text x="86" y="1893" class="stage" text-anchor="start"><tspan x="86" dy="0">证据日</tspan></text>
<line x1="300" y1="1860" x2="300" y2="2157" class="grid"/>
<text x="316" y="1893" class="stage" text-anchor="start"><tspan x="316" dy="0">观察对象</tspan></text>
<line x1="720" y1="1860" x2="720" y2="2157" class="grid"/>
<text x="736" y="1893" class="stage" text-anchor="start"><tspan x="736" dy="0">支持的 claim</tspan></text>
<line x1="1190" y1="1860" x2="1190" y2="2157" class="grid"/>
<text x="1206" y="1893" class="stage" text-anchor="start"><tspan x="1206" dy="0">不能外推</tspan></text>
<line x1="70" y1="1912" x2="1730" y2="1912" class="grid"/>
<text x="86" y="1943" class="body-strong" text-anchor="start"><tspan x="86" dy="0">Day 08</tspan></text>
<text x="316" y="1943" class="body" text-anchor="start"><tspan x="316" dy="0">token / label / shift audit</tspan></text>
<text x="736" y="1943" class="body" text-anchor="start"><tspan x="736" dy="0">监督位置与拒绝逻辑正确</tspan></text>
<text x="1206" y="1943" class="body" text-anchor="start"><tspan x="1206" dy="0">真实来源质量或模型能力</tspan></text>
<rect x="70" y="1961" width="1660" height="49" class="table-alt"/>
<line x1="70" y1="1961" x2="1730" y2="1961" class="grid"/>
<text x="86" y="1992" class="body-strong" text-anchor="start"><tspan x="86" dy="0">Day 09</tspan></text>
<text x="316" y="1992" class="body" text-anchor="start"><tspan x="316" dy="0">lineage / mixture / overlap</tspan></text>
<text x="736" y="1992" class="body" text-anchor="start"><tspan x="736" dy="0">数据可重建、预算口径透明</tspan></text>
<text x="1206" y="1992" class="body" text-anchor="start"><tspan x="1206" dy="0">不存在语义改写污染</tspan></text>
<line x1="70" y1="2010" x2="1730" y2="2010" class="grid"/>
<text x="86" y="2041" class="body-strong" text-anchor="start"><tspan x="86" dy="0">Day 10</tspan></text>
<text x="316" y="2041" class="body" text-anchor="start"><tspan x="316" dy="0">frozen Base 112-dev</tspan></text>
<text x="736" y="2041" class="body" text-anchor="start"><tspan x="736" dy="0">后续有固定比较锚点</tspan></text>
<text x="1206" y="2041" class="body" text-anchor="start"><tspan x="1206" dy="0">跨模型、跨 execution 直接相减</tspan></text>
<rect x="70" y="2059" width="1660" height="49" class="table-alt"/>
<line x1="70" y1="2059" x2="1730" y2="2059" class="grid"/>
<text x="86" y="2090" class="body-strong" text-anchor="start"><tspan x="86" dy="0">Day 11</tspan></text>
<text x="316" y="2090" class="body" text-anchor="start"><tspan x="316" dy="0">18-row tiny overfit</tspan></text>
<text x="736" y="2090" class="body" text-anchor="start"><tspan x="736" dy="0">当前 pipeline 能学与恢复</tspan></text>
<text x="1206" y="2090" class="body" text-anchor="start"><tspan x="1206" dy="0">泛化或上线 recipe</tspan></text>
<line x1="70" y1="2108" x2="1730" y2="2108" class="grid"/>
<text x="86" y="2139" class="body-strong" text-anchor="start"><tspan x="86" dy="0">Day 12</tspan></text>
<text x="316" y="2139" class="body" text-anchor="start"><tspan x="316" dy="0">17 states / joint gates</tspan></text>
<text x="736" y="2139" class="body" text-anchor="start"><tspan x="736" dy="0">合法结论是 no eligible</tspan></text>
<text x="1206" y="2139" class="body" text-anchor="start"><tspan x="1206" dy="0">从最高总分反推可晋级</tspan></text>
  <text x="70" y="2193" class="small" text-anchor="start"><tspan x="70" dy="0">Readiness ladder：M0 lineage · M1 revision/files · M2 runtime/loader · M3 processor/mask · M4 data/eval · M5 train/capacity · M6 promotion。</tspan><tspan x="70" dy="26">任何 gate 只证明其本层对象；“后面跑通”不能静默回填前面未生成的 protocol-equivalent artifact。</tspan></text>

  <rect x="40" y="2360" width="1110" height="405" rx="18" class="decision"/>
  <text x="70" y="2404" class="section">4 · 决策 / Takeaway</text>
  <text x="70" y="2450" class="body-strong" text-anchor="start"><tspan x="70" dy="0">Week 2 最强的知识不是某个分数，而是一条 evidence-first 链：</tspan><tspan x="70" dy="31">data contract → lineage → frozen baseline → pipeline acceptance → controlled candidates → joint-gate selection。</tspan><tspan x="70" dy="31">当迁移到 Qwen3.5 时，保留这条链的结构，同时把所有模型绑定对象重新建立。</tspan><tspan x="70" dy="31">复盘的完成标准不是“每项看起来都成功”，而是每项都有 Claim / Evidence / Alternative / Limit。</tspan><tspan x="70" dy="31">因此 Day 12 的 no-candidate 与未消费 frozen test 都属于成功的实验治理结果。</tspan></text>
  <rect x="1180" y="2360" width="580" height="405" rx="18" class="boundary"/>
  <text x="1210" y="2404" class="section">证据边界</text>
