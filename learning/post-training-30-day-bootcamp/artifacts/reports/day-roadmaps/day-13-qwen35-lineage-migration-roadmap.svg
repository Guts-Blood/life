  <rect x="40" y="990" width="1720" height="590" rx="18" class="panel"/>
  <text x="70" y="1033" class="section">2 · 真正学到的知识：可迁移的判断框架</text>
  <rect x="70" y="1075" width="530" height="205" rx="16" class="blue-soft"/>
<circle cx="106" cy="1114" r="18" class="number-dot"/>
<text x="106" y="1120" class="number" text-anchor="middle">1</text>
<text x="136" y="1120" class="label" text-anchor="start"><tspan x="136" dy="0">方法与 artifact 分离</tspan></text>
<text x="96" y="1161" class="small" text-anchor="start"><tspan x="96" dy="0">清洗、去污染、逐样本审计可以复用；</tspan><tspan x="96" dy="27">model-specific bytes 与 hashes 不能复用。</tspan></text>
<rect x="635" y="1075" width="530" height="205" rx="16" class="purple-soft"/>
<circle cx="671" cy="1114" r="18" class="number-dot"/>
<text x="671" y="1120" class="number" text-anchor="middle">2</text>
<text x="701" y="1120" class="label" text-anchor="start"><tspan x="701" dy="0">Base 不等于 aligned policy</tspan></text>
<text x="661" y="1161" class="small" text-anchor="start"><tspan x="661" dy="0">S0 只提供预训练起点；没有通过 promotion</tspan><tspan x="661" dy="27">的 checkpoint 不能冒充 S1。</tspan></text>
<rect x="1200" y="1075" width="530" height="205" rx="16" class="green-soft"/>
<circle cx="1236" cy="1114" r="18" class="number-dot"/>
<text x="1236" y="1120" class="number" text-anchor="middle">3</text>
<text x="1266" y="1120" class="label" text-anchor="start"><tspan x="1266" dy="0">Text-only 仍有多模态边界</tspan></text>
<text x="1226" y="1161" class="small" text-anchor="start"><tspan x="1226" dy="0">保留完整 processor；image/video=0；</tspan><tspan x="1226" dy="27">用 trainable inventory 证明 ViT/aligner 冻结。</tspan></text>
<rect x="70" y="1310" width="530" height="205" rx="16" class="amber-soft"/>
<circle cx="106" cy="1349" r="18" class="number-dot"/>
<text x="106" y="1355" class="number" text-anchor="middle">4</text>
<text x="136" y="1355" class="label" text-anchor="start"><tspan x="136" dy="0">负结果也能迁移</tspan></text>
<text x="96" y="1396" class="small" text-anchor="start"><tspan x="96" dy="0">Day 12 的 no-candidate 教会 fail closed；</tspan><tspan x="96" dy="27">它不证明 4B 也会失败。</tspan></text>
<rect x="635" y="1310" width="530" height="205" rx="16" class="cyan-soft"/>
<circle cx="671" cy="1349" r="18" class="number-dot"/>
<text x="671" y="1355" class="number" text-anchor="middle">5</text>
<text x="701" y="1355" class="label" text-anchor="start"><tspan x="701" dy="0">Eval identity 必须重建</tspan></text>
<text x="661" y="1396" class="small" text-anchor="start"><tspan x="661" dy="0">scorer 意义可复用；render、prediction、</tspan><tspan x="661" dy="27">comparison key 与 Base score 都绑定模型。</tspan></text>
<rect x="1200" y="1310" width="530" height="205" rx="16" class="slate-soft"/>
<circle cx="1236" cy="1349" r="18" class="number-dot"/>
<text x="1236" y="1355" class="number" text-anchor="middle">6</text>
<text x="1266" y="1355" class="label" text-anchor="start"><tspan x="1266" dy="0">Lineage 是因果边界</tspan></text>
<text x="1226" y="1396" class="small" text-anchor="start"><tspan x="1226" dy="0">跨模型 aggregate 只能并列描述；</tspan><tspan x="1226" dy="27">不能把规模差异误写成训练增益。</tspan></text>

  <rect x="40" y="1610" width="1720" height="720" rx="18" class="panel"/>
  <text x="70" y="1653" class="section">3 · Evidence：关键数字、对照与决策依据</text>
  <rect x="70" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="94" y="1724" class="stage" text-anchor="start"><tspan x="94" dy="0">V1 TERMINAL</tspan></text>
<text x="94" y="1769" class="metric-value" text-anchor="start"><tspan x="94" dy="0">10 / 10 · 0 accepted</tspan></text>
<text x="94" y="1802" class="tiny" text-anchor="start"><tspan x="94" dy="0">Day 12 recovery；frozen test 未消费</tspan></text>
<rect x="480" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="504" y="1724" class="stage" text-anchor="start"><tspan x="504" dy="0">V2 REPOSITORY</tspan></text>
<text x="504" y="1769" class="metric-value" text-anchor="start"><tspan x="504" dy="0">4,659,865,088 params</tspan></text>
<text x="504" y="1802" class="tiny" text-anchor="start"><tspan x="504" dy="0">完整 conditional-generation checkpoint</tspan></text>
<rect x="890" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="914" y="1724" class="stage" text-anchor="start"><tspan x="914" dy="0">NATIVE CONTEXT</tspan></text>
<text x="914" y="1769" class="metric-value" text-anchor="start"><tspan x="914" dy="0">262,144 tokens</tspan></text>
<text x="914" y="1802" class="tiny" text-anchor="start"><tspan x="914" dy="0">不是首轮训练长度承诺</tspan></text>
<rect x="1300" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="1324" y="1724" class="stage" text-anchor="start"><tspan x="1324" dy="0">ACTIVE S0 REVISION</tspan></text>
<text x="1324" y="1769" class="metric-value" text-anchor="start"><tspan x="1324" dy="0">1001bb4d…741b</tspan></text>
<text x="1324" y="1802" class="tiny" text-anchor="start"><tspan x="1324" dy="0">独立于 v1 ddc928…e865</tspan></text>
  <rect x="70" y="1860" width="1660" height="248" rx="12" class="table-bg"/>
<rect x="70" y="1860" width="1660" height="52" rx="12" class="table-head"/>
<text x="86" y="1893" class="stage" text-anchor="start"><tspan x="86" dy="0">对象</tspan></text>
<line x1="430" y1="1860" x2="430" y2="2108" class="grid"/>
<text x="446" y="1893" class="stage" text-anchor="start"><tspan x="446" dy="0">允许跨越 v1→v2</tspan></text>
<line x1="900" y1="1860" x2="900" y2="2108" class="grid"/>
<text x="916" y="1893" class="stage" text-anchor="start"><tspan x="916" dy="0">必须在 v2 重建</tspan></text>
<line x1="70" y1="1912" x2="1730" y2="1912" class="grid"/>
<text x="86" y="1943" class="body-strong" text-anchor="start"><tspan x="86" dy="0">Raw source / provenance</tspan></text>
<text x="446" y="1943" class="body" text-anchor="start"><tspan x="446" dy="0">重新审核后可引用</tspan></text>
<text x="916" y="1943" class="body" text-anchor="start"><tspan x="916" dy="0">新 manifest 记录真实 parent 与 decision ledger</tspan></text>
<rect x="70" y="1961" width="1660" height="49" class="table-alt"/>
<line x1="70" y1="1961" x2="1730" y2="1961" class="grid"/>
<text x="86" y="1992" class="body-strong" text-anchor="start"><tspan x="86" dy="0">清洗 / scorer 方法</tspan></text>
<text x="446" y="1992" class="body" text-anchor="start"><tspan x="446" dy="0">可复用方法与语义</tspan></text>
<text x="916" y="1992" class="body" text-anchor="start"><tspan x="916" dy="0">新 processor、render、comparison identity</tspan></text>
<line x1="70" y1="2010" x2="1730" y2="2010" class="grid"/>
<text x="86" y="2041" class="body-strong" text-anchor="start"><tspan x="86" dy="0">Rendered / tokens / labels</tspan></text>
<text x="446" y="2041" class="body" text-anchor="start"><tspan x="446" dy="0">不可复用</tspan></text>
<text x="916" y="2041" class="body" text-anchor="start"><tspan x="916" dy="0">全部重新编码、计量、hash 与边界审计</tspan></text>
<rect x="70" y="2059" width="1660" height="49" class="table-alt"/>
<line x1="70" y1="2059" x2="1730" y2="2059" class="grid"/>
<text x="86" y="2090" class="body-strong" text-anchor="start"><tspan x="86" dy="0">Predictions / checkpoint / score</tspan></text>
<text x="446" y="2090" class="body" text-anchor="start"><tspan x="446" dy="0">不可作为新 parent 或增益</tspan></text>
<text x="916" y="2090" class="body" text-anchor="start"><tspan x="916" dy="0">v2 Base、candidate、promotion 与 downstream key</tspan></text>
  <text x="70" y="2144" class="small" text-anchor="start"><tspan x="70" dy="0">正确迁移顺序：immutable v1 → exact S0 → processor/data/eval acceptance → controlled SFT S1 → DPO 或 GRPO。</tspan><tspan x="70" dy="26">后续实验证明这条边界必要；这些后验数字用于完善知识图，不冒充 Day 13 当天的 GPU 结果。</tspan></text>

  <rect x="40" y="2360" width="1110" height="405" rx="18" class="decision"/>
  <text x="70" y="2404" class="section">4 · 决策 / Takeaway</text>
  <text x="70" y="2450" class="body-strong" text-anchor="start"><tspan x="70" dy="0">核心结论：迁移模型时，真正要迁移的是“判断框架”，不是旧模型产生的字节。</tspan><tspan x="70" dy="31">S0、S1、S2 是不同角色：Base 不能绕过 SFT promotion 直接充当 DPO/GRPO parent。</tspan><tspan x="70" dy="31">任何新 run 先回答五个问题：模型是谁？processor 是谁？监督落在哪些 token？</tspan><tspan x="70" dy="31">比较尺是否匹配？checkpoint 是否拥有可验证的 ancestry？</tspan><tspan x="70" dy="31">一句话记忆：raw evidence 可以重新审；model-bound evidence 必须重新生成。</tspan></text>
  <rect x="1180" y="2360" width="580" height="405" rx="18" class="boundary"/>
  <text x="1210" y="2404" class="section">证据边界</text>
  <text x="1210" y="2450" class="small" text-anchor="start"><tspan x="1210" dy="0">• 原 Day 13 README 的阅读 checklist / 三个 takeaway</tspan><tspan x="1210" dy="29">  没有单独签收记录。</tspan><tspan x="1210" dy="29">• 本图依据实际迁移计划、机器合同与后来证据</tspan><tspan x="1210" dy="29">  重建知识，不声称完成了某次未留痕精读。</tspan><tspan x="1210" dy="29">• Day 12 的 0.6B checkpoint 不可成为 v2 parent。</tspan><tspan x="1210" dy="29">• native 262K context 不等于训练应直接使用 262K。</tspan><tspan x="1210" dy="29">• teacher 分支仍为 null / deferred，不能静默选择。</tspan></text>

