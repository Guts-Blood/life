  <title id="title">Day 13 · Qwen3 v1 → Qwen3.5 v2：Lineage 迁移边界</title>
  <desc id="desc">A Chinese roadmap explaining the immutable Qwen3 v1 history, the new Qwen3.5 v2 lineage, which methods may cross the lineage boundary, which model-specific artifacts must be rebuilt, and why only a promoted S1 may parent DPO or GRPO.</desc>
