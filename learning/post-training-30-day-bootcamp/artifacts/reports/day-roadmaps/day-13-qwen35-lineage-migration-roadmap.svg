  <rect width="1800" height="2840" fill="#f5f7fb"/>
  <text x="50" y="62" class="title">Day 13 · Qwen3 v1 → Qwen3.5 v2：Lineage 迁移边界</text>
  <text x="50" y="95" class="subtitle">方法可以复用，模型绑定的证据必须重建；迁移不是把旧 runner 里的 model ID 替换掉。</text>
  <rect x="1190" y="108" width="570" height="38" rx="19" class="status-info"/>
  <text x="1475" y="133" class="stage" text-anchor="middle">ROADMAP RECONSTRUCTED · MIGRATION BOUNDARY VERIFIED</text>

  <rect x="40" y="165" width="1720" height="112" rx="18" class="hero"/>
  <text x="70" y="203" class="section">一句话 Gate</text>
  <text x="270" y="203" class="label" text-anchor="start"><tspan x="270" dy="0">v1 与 v2 没有权重连续性；未经重新 render、tokenize、baseline 与训练验收，v1 artifact 不得跨 lineage 使用。</tspan><tspan x="270" dy="31">能带走的是 raw IDs、provenance、审计方法与 scorer 语义；tokens、predictions、checkpoint 与能力结论必须留在原 lineage。</tspan></text>

  <rect x="40" y="310" width="1720" height="650" rx="18" class="panel"/>
  <text x="70" y="352" class="section">1 · Roadmap：从输入边界到可交付结论</text>
  <text x="70" y="382" class="small">每一步都回答“对象是什么、证据在哪里、失败时停在哪一层”；编号代表依赖顺序。</text>
  <text x="70" y="391" class="stage">01 · FREEZE V1</text>
<rect x="70" y="405" width="360" height="210" rx="16" class="blue"/>
<text x="94" y="445" class="label" text-anchor="start"><tspan x="94" dy="0">封存旧证据</tspan></text>
<line x1="94" y1="463" x2="406" y2="463" class="divider"/>
<text x="94" y="497" class="small" text-anchor="start"><tspan x="94" dy="0">Day 01–12 作为 immutable history</tspan><tspan x="94" dy="28">Qwen3-0.6B 不再是权重父节点</tspan><tspan x="94" dy="28">保留合法负结果，不回写</tspan></text>
<text x="480" y="391" class="stage">02 · OPEN V2</text>
<rect x="480" y="405" width="360" height="210" rx="16" class="cyan"/>
<text x="504" y="445" class="label" text-anchor="start"><tspan x="504" dy="0">新建独立 lineage</tspan></text>
<line x1="504" y1="463" x2="816" y2="463" class="divider"/>
<text x="504" y="497" class="small" text-anchor="start"><tspan x="504" dy="0">qwen35-4b-day13-plus-v2</tspan><tspan x="504" dy="28">S0 = exact Qwen3.5-4B Base</tspan><tspan x="504" dy="28">run 必须声明 parent 与 lineage_id</tspan></text>
<text x="890" y="391" class="stage">03 · RESOLVE MODEL</text>
<rect x="890" y="405" width="360" height="210" rx="16" class="purple"/>
<text x="914" y="445" class="label" text-anchor="start"><tspan x="914" dy="0">重读模型边界</tspan></text>
<line x1="914" y1="463" x2="1226" y2="463" class="divider"/>
<text x="914" y="497" class="small" text-anchor="start"><tspan x="914" dy="0">ConditionalGeneration + AutoProcessor</tspan><tspan x="914" dy="28">GDN / MTP + vision components</tspan><tspan x="914" dy="28">不是旧 CausalLM 的 drop-in replacement</tspan></text>
<text x="1300" y="391" class="stage">04 · REBUILD CONTRACT</text>
<rect x="1300" y="405" width="360" height="210" rx="16" class="green"/>
<text x="1324" y="445" class="label" text-anchor="start"><tspan x="1324" dy="0">重建监督契约</tspan></text>
<line x1="1324" y1="463" x2="1636" y2="463" class="divider"/>
<text x="1324" y="497" class="small" text-anchor="start"><tspan x="1324" dy="0">template / thinking / special tokens</tspan><tspan x="1324" dy="28">assistant spans / causal shift / truncation</tspan><tspan x="1324" dy="28">text-only 时仍审计 ViT / aligner</tspan></text>
<text x="280" y="676" class="stage">05 · REBUILD DATA</text>
<rect x="280" y="690" width="360" height="210" rx="16" class="amber"/>
<text x="304" y="730" class="label" text-anchor="start"><tspan x="304" dy="0">重新分词与计量</tspan></text>
<line x1="304" y1="748" x2="616" y2="748" class="divider"/>
<text x="304" y="782" class="small" text-anchor="start"><tspan x="304" dy="0">raw IDs 可重新审核</tspan><tspan x="304" dy="28">token budget / mixture 全部重算</tspan><tspan x="304" dy="28">旧 rendered text 与 label spans 禁用</tspan></text>
<text x="720" y="676" class="stage">06 · REBUILD EVAL</text>
<rect x="720" y="690" width="360" height="210" rx="16" class="teal"/>
<text x="744" y="730" class="label" text-anchor="start"><tspan x="744" dy="0">重新建立比较尺</tspan></text>
<line x1="744" y1="748" x2="1056" y2="748" class="divider"/>
<text x="744" y="782" class="small" text-anchor="start"><tspan x="744" dy="0">先跑 v2 Base baseline</tspan><tspan x="744" dy="28">冻结 prompt / decoder / scorer identity</tspan><tspan x="744" dy="28">new selection + confirmation contract</tspan></text>
<text x="1160" y="676" class="stage">07 · PROMOTE THEN BRANCH</text>
<rect x="1160" y="690" width="360" height="210" rx="16" class="indigo"/>
<text x="1184" y="730" class="label" text-anchor="start"><tspan x="1184" dy="0">只从 S1 分叉</tspan></text>
<line x1="1184" y1="748" x2="1496" y2="748" class="divider"/>
<text x="1184" y="782" class="small" text-anchor="start"><tspan x="1184" dy="0">受控 SFT candidate → promotion</tspan><tspan x="1184" dy="28">S1 需 immutable downstream identity</tspan><tspan x="1184" dy="28">DPO / GRPO 共享正式 parent</tspan></text>
