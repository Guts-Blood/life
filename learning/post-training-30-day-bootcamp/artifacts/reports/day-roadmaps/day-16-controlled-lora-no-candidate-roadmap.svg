  <title id="title">Day 16 · Controlled LoRA：三档 LR Probe，0 个合格 Anchor</title>
  <desc id="desc">A Chinese roadmap of the controlled Qwen3.5 LoRA learning-rate probes, their shared training identity, the fixed diagnostic guardrails, the no-eligible-candidate decision, and the distinction between safe training evidence and model-quality promotion evidence.</desc>
