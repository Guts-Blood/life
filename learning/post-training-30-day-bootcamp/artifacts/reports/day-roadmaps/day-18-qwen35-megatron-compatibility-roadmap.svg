  <rect width="1800" height="2840" fill="#f5f7fb"/>
  <text x="50" y="62" class="title">Day 18 · Qwen3.5 × Megatron：从源码链到 C0–C5 闭环</text>
  <text x="50" y="95" class="subtitle">兼容性不是“命令能启动”，而是 conversion、parity、update、checkpoint、export 与 ownership 的证据链。</text>
  <rect x="1190" y="108" width="570" height="38" rx="19" class="status-good"/>
  <text x="1475" y="133" class="stage" text-anchor="middle">CLOSED PASS · C0–C5 · 10/10 REQUIRED GATES</text>

  <rect x="40" y="165" width="1720" height="112" rx="18" class="hero"/>
  <text x="70" y="203" class="section">一句话 Gate</text>
  <text x="270" y="203" class="label" text-anchor="start"><tspan x="270" dy="0">10/10 required gates PASS：只在 exact revision、BF16、2×H800、text-only 两行 fixture、冻结 TP/DP/MTP/checkpoint/export envelope 内成立。</tspan><tspan x="270" dy="31">它证明兼容与可学习，不证明 vision、长序列、多节点、吞吐 scaling、泛化、exact resume 或可晋级 S1。</tspan></text>

  <rect x="40" y="310" width="1720" height="650" rx="18" class="panel"/>
  <text x="70" y="352" class="section">1 · Roadmap：从输入边界到可交付结论</text>
  <text x="70" y="382" class="small">每一步都回答“对象是什么、证据在哪里、失败时停在哪一层”；编号代表依赖顺序。</text>
  <text x="70" y="391" class="stage">01 · FREEZE ENVELOPE</text>
<rect x="70" y="405" width="360" height="210" rx="16" class="blue"/>
<text x="94" y="445" class="label" text-anchor="start"><tspan x="94" dy="0">冻结运行边界</tspan></text>
<line x1="94" y1="463" x2="406" y2="463" class="divider"/>
<text x="94" y="497" class="small" text-anchor="start"><tspan x="94" dy="0">Qwen3.5 revision + ms-swift commit</tspan><tspan x="94" dy="28">2×H800 PCIe · BF16 · same host</tspan><tspan x="94" dy="28">2 rows · 72 supervised targets</tspan></text>
<text x="480" y="391" class="stage">02 · TRACE SOURCE</text>
<rect x="480" y="405" width="360" height="210" rx="16" class="cyan"/>
<text x="504" y="445" class="label" text-anchor="start"><tspan x="504" dy="0">插桩 8-node codepath</tspan></text>
<line x1="504" y1="463" x2="816" y2="463" class="divider"/>
<text x="504" y="497" class="small" text-anchor="start"><tspan x="504" dy="0">loader → processor → conversion</tspan><tspan x="504" dy="28">GDN → loss → optimizer</tspan><tspan x="504" dy="28">distributed save/load → HF export</tspan></text>
<text x="890" y="391" class="stage">03 · C0</text>
<rect x="890" y="405" width="360" height="210" rx="16" class="purple"/>
<text x="914" y="445" class="label" text-anchor="start"><tspan x="914" dy="0">HF → MCore conversion</tspan></text>
<line x1="914" y1="463" x2="1226" y2="463" class="divider"/>
<text x="914" y="497" class="small" text-anchor="start"><tspan x="914" dy="0">核对 parameter names / shapes</tspan><tspan x="914" dy="28">738 tensor mappings accounted</tspan><tspan x="914" dy="28">15 MTP tensors round-trip</tspan></text>
<text x="1300" y="391" class="stage">04 · C1</text>
<rect x="1300" y="405" width="360" height="210" rx="16" class="green"/>
<text x="1324" y="445" class="label" text-anchor="start"><tspan x="1324" dy="0">单 rank 数值 parity</tspan></text>
<line x1="1324" y1="463" x2="1636" y2="463" class="divider"/>
<text x="1324" y="497" class="small" text-anchor="start"><tspan x="1324" dy="0">HF vs MCore logits / loss</tspan><tspan x="1324" dy="28">loss-token argmax mismatch = 0</tspan><tspan x="1324" dy="28">在预注册 tolerance 内</tspan></text>
<text x="280" y="676" class="stage">05 · C2 / C3</text>
<rect x="280" y="690" width="360" height="210" rx="16" class="amber"/>
<text x="304" y="730" class="label" text-anchor="start"><tspan x="304" dy="0">DP 与 TP 真更新</tspan></text>
<line x1="304" y1="748" x2="616" y2="748" class="divider"/>
<text x="304" y="782" class="small" text-anchor="start"><tspan x="304" dy="0">TP1/DP2：3 updates</tspan><tspan x="304" dy="28">TP2/DP1：3 updates</tspan><tspan x="304" dy="28">固定 label-token budget 与 ownership</tspan></text>
<text x="720" y="676" class="stage">06 · C4</text>
<rect x="720" y="690" width="360" height="210" rx="16" class="teal"/>
<text x="744" y="730" class="label" text-anchor="start"><tspan x="744" dy="0">分布式 checkpoint</tspan></text>
<line x1="744" y1="748" x2="1056" y2="748" class="divider"/>
<text x="744" y="782" class="small" text-anchor="start"><tspan x="744" dy="0">新进程 iteration 3 → 5</tspan><tspan x="744" dy="28">恢复 model / Adam / RNG</tspan><tspan x="744" dy="28">HF export/reload parity</tspan></text>
<text x="1160" y="676" class="stage">07 · C5</text>
<rect x="1160" y="690" width="360" height="210" rx="16" class="indigo"/>
<text x="1184" y="730" class="label" text-anchor="start"><tspan x="1184" dy="0">同入口 tiny overfit</tspan></text>
<line x1="1184" y1="748" x2="1496" y2="748" class="divider"/>
<text x="1184" y="782" class="small" text-anchor="start"><tspan x="1184" dy="0">fresh Base → 150 updates</tspan><tspan x="1184" dy="28">72/72 teacher-forced targets</tspan><tspan x="1184" dy="28">vision / aligner bitwise unchanged</tspan></text>
  <path d="M 430 510 L 470 510" class="line"/>
<path d="M 840 510 L 880 510" class="line"/>
