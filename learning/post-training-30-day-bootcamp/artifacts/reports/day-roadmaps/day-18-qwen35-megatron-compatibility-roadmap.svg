  <rect x="40" y="990" width="1720" height="590" rx="18" class="panel"/>
  <text x="70" y="1033" class="section">2 · 真正学到的知识：可迁移的判断框架</text>
  <rect x="70" y="1075" width="530" height="205" rx="16" class="blue-soft"/>
<circle cx="106" cy="1114" r="18" class="number-dot"/>
<text x="106" y="1120" class="number" text-anchor="middle">1</text>
<text x="136" y="1120" class="label" text-anchor="start"><tspan x="136" dy="0">Compatibility 是端到端属性</tspan></text>
<text x="96" y="1161" class="small" text-anchor="start"><tspan x="96" dy="0">loader、conversion、kernel、loss、optimizer、</tspan><tspan x="96" dy="27">checkpoint/export 任一断裂都不能叫兼容。</tspan></text>
<rect x="635" y="1075" width="530" height="205" rx="16" class="purple-soft"/>
<circle cx="671" cy="1114" r="18" class="number-dot"/>
<text x="671" y="1120" class="number" text-anchor="middle">2</text>
<text x="701" y="1120" class="label" text-anchor="start"><tspan x="701" dy="0">TP/DP 要比较语义</tspan></text>
<text x="661" y="1161" class="small" text-anchor="start"><tspan x="661" dy="0">不仅看进程存活；还要固定 label-token budget、</tspan><tspan x="661" dy="27">首个 loss、真实 update 与 state ownership。</tspan></text>
<rect x="1200" y="1075" width="530" height="205" rx="16" class="green-soft"/>
<circle cx="1236" cy="1114" r="18" class="number-dot"/>
<text x="1236" y="1120" class="number" text-anchor="middle">3</text>
<text x="1266" y="1120" class="label" text-anchor="start"><tspan x="1266" dy="0">Text-only 仍审计 vision</tspan></text>
<text x="1226" y="1161" class="small" text-anchor="start"><tspan x="1226" dy="0">无视觉 token 不是冻结证明；需比较训练前后</tspan><tspan x="1226" dy="27">所有 vision / aligner tensors。</tspan></text>
<rect x="70" y="1310" width="530" height="205" rx="16" class="amber-soft"/>
<circle cx="106" cy="1349" r="18" class="number-dot"/>
<text x="106" y="1355" class="number" text-anchor="middle">4</text>
<text x="136" y="1355" class="label" text-anchor="start"><tspan x="136" dy="0">Parity 要提前写 tolerance</tspan></text>
<text x="96" y="1396" class="small" text-anchor="start"><tspan x="96" dy="0">先冻结 logits/loss/argmax 标准，</tspan><tspan x="96" dy="27">再运行，避免看结果后放宽阈值。</tspan></text>
<rect x="635" y="1310" width="530" height="205" rx="16" class="cyan-soft"/>
<circle cx="671" cy="1349" r="18" class="number-dot"/>
<text x="671" y="1355" class="number" text-anchor="middle">5</text>
<text x="701" y="1355" class="label" text-anchor="start"><tspan x="701" dy="0">Continuation ≠ exact resume</tspan></text>
<text x="661" y="1396" class="small" text-anchor="start"><tspan x="661" dy="0">C4 证明新进程能继续；没有 uninterrupted</tspan><tspan x="661" dy="27">5-step comparator 就不能声称 trajectory exact。</tspan></text>
<rect x="1200" y="1310" width="530" height="205" rx="16" class="slate-soft"/>
<circle cx="1236" cy="1349" r="18" class="number-dot"/>
<text x="1236" y="1355" class="number" text-anchor="middle">6</text>
<text x="1266" y="1355" class="label" text-anchor="start"><tspan x="1266" dy="0">Tiny overfit 是入口证据</tspan></text>
<text x="1226" y="1396" class="small" text-anchor="start"><tspan x="1226" dy="0">它证明相同训练入口能学、保存、导出；</tspan><tspan x="1226" dy="27">不证明对未见任务的泛化。</tspan></text>

  <rect x="40" y="1610" width="1720" height="720" rx="18" class="panel"/>
  <text x="70" y="1653" class="section">3 · Evidence：关键数字、对照与决策依据</text>
  <rect x="70" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="94" y="1724" class="stage" text-anchor="start"><tspan x="94" dy="0">CONVERSION</tspan></text>
<text x="94" y="1769" class="metric-value" text-anchor="start"><tspan x="94" dy="0">738 · 15/15 MTP</tspan></text>
<text x="94" y="1802" class="tiny" text-anchor="start"><tspan x="94" dy="0">HF mappings · exact MTP round-trip</tspan></text>
<rect x="480" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="504" y="1724" class="stage" text-anchor="start"><tspan x="504" dy="0">TOPOLOGY</tspan></text>
<text x="504" y="1769" class="metric-value" text-anchor="start"><tspan x="504" dy="0">3 + 3 updates</tspan></text>
<text x="504" y="1802" class="tiny" text-anchor="start"><tspan x="504" dy="0">TP1/DP2 and TP2/DP1</tspan></text>
<rect x="890" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="914" y="1724" class="stage" text-anchor="start"><tspan x="914" dy="0">C5 LEARNING</tspan></text>
<text x="914" y="1769" class="metric-value" text-anchor="start"><tspan x="914" dy="0">150/150 · 72/72</tspan></text>
<text x="914" y="1802" class="tiny" text-anchor="start"><tspan x="914" dy="0">loss 2.4077 → 3.31e-08</tspan></text>
<rect x="1300" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="1324" y="1724" class="stage" text-anchor="start"><tspan x="1324" dy="0">CLOSEOUT</tspan></text>
<text x="1324" y="1769" class="metric-value" text-anchor="start"><tspan x="1324" dy="0">65 hashes · 0 open</tspan></text>
<text x="1324" y="1802" class="tiny" text-anchor="start"><tspan x="1324" dy="0">16/16 tests · 17 issue classes resolved/observed</tspan></text>
  <rect x="70" y="1860" width="1660" height="346" rx="12" class="table-bg"/>
<rect x="70" y="1860" width="1660" height="52" rx="12" class="table-head"/>
<text x="86" y="1893" class="stage" text-anchor="start"><tspan x="86" dy="0">Gate</tspan></text>
<line x1="240" y1="1860" x2="240" y2="2206" class="grid"/>
<text x="256" y="1893" class="stage" text-anchor="start"><tspan x="256" dy="0">关键测试</tspan></text>
<line x1="890" y1="1860" x2="890" y2="2206" class="grid"/>
<text x="906" y="1893" class="stage" text-anchor="start"><tspan x="906" dy="0">运行结果</tspan></text>
<line x1="70" y1="1912" x2="1730" y2="1912" class="grid"/>
<text x="86" y="1943" class="body-strong" text-anchor="start"><tspan x="86" dy="0">C0</tspan></text>
<text x="256" y="1943" class="body" text-anchor="start"><tspan x="256" dy="0">HF→MCore→HF tensor accounting</tspan></text>
<text x="906" y="1943" class="body" text-anchor="start"><tspan x="906" dy="0">738 mappings；15/15 MTP exact round-trip</tspan></text>
<rect x="70" y="1961" width="1660" height="49" class="table-alt"/>
<line x1="70" y1="1961" x2="1730" y2="1961" class="grid"/>
<text x="86" y="1992" class="body-strong" text-anchor="start"><tspan x="86" dy="0">C1</tspan></text>
<text x="256" y="1992" class="body" text-anchor="start"><tspan x="256" dy="0">2-row logits / loss parity</tspan></text>
<text x="906" y="1992" class="body" text-anchor="start"><tspan x="906" dy="0">HF 2.407724 vs MCore 2.402899；argmax mismatch 0</tspan></text>
<line x1="70" y1="2010" x2="1730" y2="2010" class="grid"/>
<text x="86" y="2041" class="body-strong" text-anchor="start"><tspan x="86" dy="0">C2</tspan></text>
<text x="256" y="2041" class="body" text-anchor="start"><tspan x="256" dy="0">TP1 / DP2 optimizer + checkpoint</tspan></text>
<text x="906" y="2041" class="body" text-anchor="start"><tspan x="906" dy="0">loss 2.4034→0.2631；peak 52.34 GiB/GPU</tspan></text>
<rect x="70" y="2059" width="1660" height="49" class="table-alt"/>
<line x1="70" y1="2059" x2="1730" y2="2059" class="grid"/>
<text x="86" y="2090" class="body-strong" text-anchor="start"><tspan x="86" dy="0">C3</tspan></text>
<text x="256" y="2090" class="body" text-anchor="start"><tspan x="256" dy="0">TP2 / DP1 optimizer + checkpoint</tspan></text>
<text x="906" y="2090" class="body" text-anchor="start"><tspan x="906" dy="0">loss 2.4001→0.2518；peak 38.91 GiB/GPU</tspan></text>
<line x1="70" y1="2108" x2="1730" y2="2108" class="grid"/>
<text x="86" y="2139" class="body-strong" text-anchor="start"><tspan x="86" dy="0">C4</tspan></text>
<text x="256" y="2139" class="body" text-anchor="start"><tspan x="256" dy="0">fresh continuation + export/reload</tspan></text>
<text x="906" y="2139" class="body" text-anchor="start"><tspan x="906" dy="0">iteration 3→5；export argmax mismatch 0</tspan></text>
<rect x="70" y="2157" width="1660" height="49" class="table-alt"/>
<line x1="70" y1="2157" x2="1730" y2="2157" class="grid"/>
<text x="86" y="2188" class="body-strong" text-anchor="start"><tspan x="86" dy="0">C5</tspan></text>
<text x="256" y="2188" class="body" text-anchor="start"><tspan x="256" dy="0">150-step overfit + ownership audit</tspan></text>
<text x="906" y="2188" class="body" text-anchor="start"><tspan x="906" dy="0">accuracy 0.541667→1.0；297 visual tensors unchanged</tspan></text>
  <text x="70" y="2242" class="small" text-anchor="start"><tspan x="70" dy="0">C2/C3 first-loss difference = 0.00330782；C4 export max difference = 0.00941098；所有 required gates 在预注册 tolerance 内通过。</tspan><tspan x="70" dy="26">Closeout 重新验证 evidence tar、113 members、65 inventory entries、portable SHA sidecar 与 16 tests；追加 GPU = 0。</tspan></text>

  <rect x="40" y="2360" width="1110" height="405" rx="18" class="decision"/>
  <text x="70" y="2404" class="section">4 · 决策 / Takeaway</text>
  <text x="70" y="2450" class="body-strong" text-anchor="start"><tspan x="70" dy="0">结论：Qwen3.5-4B Base 在冻结的 Megatron envelope 内 compatible + learnable。</tspan><tspan x="70" dy="31">安全复用方式：把它作为后续 loader/GDN/TP/DP/checkpoint/export 的 runtime evidence，</tspan><tspan x="70" dy="31">而不是把 C5 的 two-row overfit checkpoint 当成正式 SFT candidate。</tspan><tspan x="70" dy="31">最重要的工程方法：沿真实 source codepath 绑定每个 tensor、rank、state owner 与 artifact，</tspan><tspan x="70" dy="31">并让每个失败停在第一个可辨别 gate，而不是用最终 exception 猜根因。</tspan></text>
