  <rect width="1800" height="2840" fill="#f5f7fb"/>
  <text x="50" y="62" class="title">Day 17 · Exact Resume：Checkpoint 能加载，不等于轨迹连续</text>
  <text x="50" y="95" class="subtitle">完整状态清单、Run A/B comparator 与 first-divergence 证据，才构成训练连续性证明。</text>
  <rect x="1190" y="108" width="570" height="38" rx="19" class="status-warn"/>
  <text x="1475" y="133" class="stage" text-anchor="middle">METHOD CONTRACT COMPLETE · OPTIONAL R NOT RUN · exact_resume=false</text>

  <rect x="40" y="165" width="1720" height="112" rx="18" class="hero"/>
  <text x="70" y="203" class="section">一句话 Gate</text>
  <text x="270" y="203" class="label" text-anchor="start"><tspan x="270" dy="0">selected/resumable S1 已归档，但真正的 exact-resume comparator 仍未运行：Run A 0→40 对 Run B 0→20→fresh process→40。</tspan><tspan x="270" dy="31">Day 21 的 checkpoint integrity 与 adapter↔merged parity 不能替代 step 21–40 的数据、优化器、RNG 与 tensor trajectory 对齐。</tspan></text>

  <rect x="40" y="310" width="1720" height="650" rx="18" class="panel"/>
  <text x="70" y="352" class="section">1 · Roadmap：从输入边界到可交付结论</text>
  <text x="70" y="382" class="small">每一步都回答“对象是什么、证据在哪里、失败时停在哪一层”；编号代表依赖顺序。</text>
  <text x="70" y="391" class="stage">01 · FREEZE CONTRACT</text>
<rect x="70" y="405" width="360" height="210" rx="16" class="blue"/>
<text x="94" y="445" class="label" text-anchor="start"><tspan x="94" dy="0">冻结同一训练身份</tspan></text>
<line x1="94" y1="463" x2="406" y2="463" class="divider"/>
<text x="94" y="497" class="small" text-anchor="start"><tspan x="94" dy="0">Base / LoRA / data order / seed</tspan><tspan x="94" dy="28">processor / packing / runtime / topology</tspan><tspan x="94" dy="28">Run A 与 Run B 只能差中断</tspan></text>
<text x="480" y="391" class="stage">02 · INVENTORY</text>
<rect x="480" y="405" width="360" height="210" rx="16" class="cyan"/>
<text x="504" y="445" class="label" text-anchor="start"><tspan x="504" dy="0">审计完整 state</tspan></text>
<line x1="504" y1="463" x2="816" y2="463" class="divider"/>
<text x="504" y="497" class="small" text-anchor="start"><tspan x="504" dy="0">adapter + optimizer + scheduler</tspan><tspan x="504" dy="28">Python / NumPy / Torch / CUDA RNG</tspan><tspan x="504" dy="28">sampler cursor / global step / accumulation</tspan></text>
<text x="890" y="391" class="stage">03 · RUN A</text>
<rect x="890" y="405" width="360" height="210" rx="16" class="purple"/>
<text x="914" y="445" class="label" text-anchor="start"><tspan x="914" dy="0">连续训练对照</tspan></text>
<line x1="914" y1="463" x2="1226" y2="463" class="divider"/>
<text x="914" y="497" class="small" text-anchor="start"><tspan x="914" dy="0">同一初始化 step 0 → 40</tspan><tspan x="914" dy="28">每步保存 IDs / loss / LR / grad</tspan><tspan x="914" dy="28">作为 uninterrupted reference</tspan></text>
<text x="1300" y="391" class="stage">04 · RUN B1</text>
<rect x="1300" y="405" width="360" height="210" rx="16" class="green"/>
<text x="1324" y="445" class="label" text-anchor="start"><tspan x="1324" dy="0">中断前保存</tspan></text>
<line x1="1324" y1="463" x2="1636" y2="463" class="divider"/>
<text x="1324" y="497" class="small" text-anchor="start"><tspan x="1324" dy="0">step 0 → 20</tspan><tspan x="1324" dy="28">在 accumulation boundary 保存</tspan><tspan x="1324" dy="28">退出整个 Python 进程</tspan></text>
<text x="280" y="676" class="stage">05 · RUN B2</text>
<rect x="280" y="690" width="360" height="210" rx="16" class="amber"/>
<text x="304" y="730" class="label" text-anchor="start"><tspan x="304" dy="0">新进程恢复</tspan></text>
<line x1="304" y1="748" x2="616" y2="748" class="divider"/>
<text x="304" y="782" class="small" text-anchor="start"><tspan x="304" dy="0">验证 state manifest 与 hashes</tspan><tspan x="304" dy="28">从 step 20 继续到 40</tspan><tspan x="304" dy="28">禁止 warm start 冒充 resume</tspan></text>
<text x="720" y="676" class="stage">06 · COMPARE</text>
<rect x="720" y="690" width="360" height="210" rx="16" class="teal"/>
<text x="744" y="730" class="label" text-anchor="start"><tspan x="744" dy="0">对齐 step 21–40</tspan></text>
<line x1="744" y1="748" x2="1056" y2="748" class="divider"/>
<text x="744" y="782" class="small" text-anchor="start"><tspan x="744" dy="0">sample/render/label token identity</tspan><tspan x="744" dy="28">LR / loss / grad / cumulative targets</tspan><tspan x="744" dy="28">adapter / optimizer tensor checksum</tspan></text>
<text x="1160" y="676" class="stage">07 · INJECT + CLASSIFY</text>
<rect x="1160" y="690" width="360" height="210" rx="16" class="indigo"/>
<text x="1184" y="730" class="label" text-anchor="start"><tspan x="1184" dy="0">制造并定位分叉</tspan></text>
<line x1="1184" y1="748" x2="1496" y2="748" class="divider"/>
<text x="1184" y="782" class="small" text-anchor="start"><tspan x="1184" dy="0">删 scheduler 或 sampler cursor</tspan><tspan x="1184" dy="28">跑 3–5 steps 找 first divergence</tspan><tspan x="1184" dy="28">报告 tolerance / max diff / exactness</tspan></text>
  <path d="M 430 510 L 470 510" class="line"/>
<path d="M 840 510 L 880 510" class="line"/>
<path d="M 1250 510 L 1290 510" class="line"/>
<path d="M 1660 615 C 1660 650 1520 650 1520 680" class="line-dash"/>
<path d="M 640 795 L 710 795" class="line"/>
