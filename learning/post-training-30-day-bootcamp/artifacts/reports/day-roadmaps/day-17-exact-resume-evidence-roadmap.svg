  <rect x="40" y="990" width="1720" height="590" rx="18" class="panel"/>
  <text x="70" y="1033" class="section">2 · 真正学到的知识：可迁移的判断框架</text>
  <rect x="70" y="1075" width="530" height="205" rx="16" class="blue-soft"/>
<circle cx="106" cy="1114" r="18" class="number-dot"/>
<text x="106" y="1120" class="number" text-anchor="middle">1</text>
<text x="136" y="1120" class="label" text-anchor="start"><tspan x="136" dy="0">Resume 是训练状态问题</tspan></text>
<text x="96" y="1161" class="small" text-anchor="start"><tspan x="96" dy="0">只有 adapter weights 是 warm start；</tspan><tspan x="96" dy="27">下一次 update 还依赖 optimizer、RNG 与数据位置。</tspan></text>
<rect x="635" y="1075" width="530" height="205" rx="16" class="purple-soft"/>
<circle cx="671" cy="1114" r="18" class="number-dot"/>
<text x="671" y="1120" class="number" text-anchor="middle">2</text>
<text x="701" y="1120" class="label" text-anchor="start"><tspan x="701" dy="0">证据有五个等级</tspan></text>
<text x="661" y="1161" class="small" text-anchor="start"><tspan x="661" dy="0">load → generate → continue update → trajectory</tspan><tspan x="661" dy="27">parity → bitwise exact，不能合并成一个 PASS。</tspan></text>
<rect x="1200" y="1075" width="530" height="205" rx="16" class="green-soft"/>
<circle cx="1236" cy="1114" r="18" class="number-dot"/>
<text x="1236" y="1120" class="number" text-anchor="middle">3</text>
<text x="1266" y="1120" class="label" text-anchor="start"><tspan x="1266" dy="0">比较单位是逐 step</tspan></text>
<text x="1226" y="1161" class="small" text-anchor="start"><tspan x="1226" dy="0">曲线看起来接近不够；必须核对 sample IDs、</tspan><tspan x="1226" dy="27">LR、loss、grad 与 tensor checksums。</tspan></text>
<rect x="70" y="1310" width="530" height="205" rx="16" class="amber-soft"/>
<circle cx="106" cy="1349" r="18" class="number-dot"/>
<text x="106" y="1355" class="number" text-anchor="middle">4</text>
<text x="136" y="1355" class="label" text-anchor="start"><tspan x="136" dy="0">数据游标属于模型轨迹</tspan></text>
<text x="96" y="1396" class="small" text-anchor="start"><tspan x="96" dy="0">sampler epoch、batch cursor、accumulation</tspan><tspan x="96" dy="27">boundary 漂移会在首个新 batch 分叉。</tspan></text>
<rect x="635" y="1310" width="530" height="205" rx="16" class="cyan-soft"/>
<circle cx="671" cy="1349" r="18" class="number-dot"/>
<text x="671" y="1355" class="number" text-anchor="middle">5</text>
<text x="701" y="1355" class="label" text-anchor="start"><tspan x="701" dy="0">Export 与 resumable 分开</tspan></text>
<text x="661" y="1396" class="small" text-anchor="start"><tspan x="661" dy="0">merged HF export 服务推理；完整 checkpoint</tspan><tspan x="661" dy="27">服务继续训练，它们有不同 state inventory。</tspan></text>
<rect x="1200" y="1310" width="530" height="205" rx="16" class="slate-soft"/>
<circle cx="1236" cy="1349" r="18" class="number-dot"/>
<text x="1236" y="1355" class="number" text-anchor="middle">6</text>
<text x="1266" y="1355" class="label" text-anchor="start"><tspan x="1266" dy="0">故障注入检验 auditor</tspan></text>
<text x="1226" y="1396" class="small" text-anchor="start"><tspan x="1226" dy="0">主动删 scheduler/cursor，确认检测器能指出</tspan><tspan x="1226" dy="27">第一个错误 step，而非只报告最终 checksum。</tspan></text>

  <rect x="40" y="1610" width="1720" height="720" rx="18" class="panel"/>
  <text x="70" y="1653" class="section">3 · Evidence：关键数字、对照与决策依据</text>
  <rect x="70" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="94" y="1724" class="stage" text-anchor="start"><tspan x="94" dy="0">PLANNED COMPARATOR</tspan></text>
<text x="94" y="1769" class="metric-value" text-anchor="start"><tspan x="94" dy="0">0→40 vs 0→20→40</tspan></text>
<text x="94" y="1802" class="tiny" text-anchor="start"><tspan x="94" dy="0">comparison window = steps 21–40</tspan></text>
<rect x="480" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="504" y="1724" class="stage" text-anchor="start"><tspan x="504" dy="0">AVAILABLE WINNER</tspan></text>
<text x="504" y="1769" class="metric-value" text-anchor="start"><tspan x="504" dy="0">checkpoint-1904</tspan></text>
<text x="504" y="1802" class="tiny" text-anchor="start"><tspan x="504" dy="0">selected · resumable · immutable archive</tspan></text>
<rect x="890" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="914" y="1724" class="stage" text-anchor="start"><tspan x="914" dy="0">STATE ARCHIVE</tspan></text>
<text x="914" y="1769" class="metric-value" text-anchor="start"><tspan x="914" dy="0">11 files · ≈187 MiB</tspan></text>
<text x="914" y="1802" class="tiny" text-anchor="start"><tspan x="914" dy="0">optimizer / scheduler / RNG / trainer present</tspan></text>
<rect x="1300" y="1690" width="385" height="140" rx="16" class="metric"/>
<text x="1324" y="1724" class="stage" text-anchor="start"><tspan x="1324" dy="0">RUNTIME RESULT</tspan></text>
<text x="1324" y="1769" class="metric-value" text-anchor="start"><tspan x="1324" dy="0">exact_resume = false</tspan></text>
<text x="1324" y="1802" class="tiny" text-anchor="start"><tspan x="1324" dy="0">Optional R not run; does not block S1</tspan></text>
  <rect x="70" y="1860" width="1660" height="297" rx="12" class="table-bg"/>
<rect x="70" y="1860" width="1660" height="52" rx="12" class="table-head"/>
<text x="86" y="1893" class="stage" text-anchor="start"><tspan x="86" dy="0">证据等级</tspan></text>
<line x1="370" y1="1860" x2="370" y2="2157" class="grid"/>
<text x="386" y="1893" class="stage" text-anchor="start"><tspan x="386" dy="0">当前 evidence</tspan></text>
<line x1="810" y1="1860" x2="810" y2="2157" class="grid"/>
<text x="826" y="1893" class="stage" text-anchor="start"><tspan x="826" dy="0">能支持的 claim</tspan></text>
<line x1="1230" y1="1860" x2="1230" y2="2157" class="grid"/>
<text x="1246" y="1893" class="stage" text-anchor="start"><tspan x="1246" dy="0">仍缺什么</tspan></text>
<line x1="70" y1="1912" x2="1730" y2="1912" class="grid"/>
<text x="86" y="1943" class="body-strong" text-anchor="start"><tspan x="86" dy="0">1 · Checkpoint loads</tspan></text>
<text x="386" y="1943" class="body" text-anchor="start"><tspan x="386" dy="0">Day 21 archive / integrity</tspan></text>
<text x="826" y="1943" class="body" text-anchor="start"><tspan x="826" dy="0">资产完整、可解析</tspan></text>
<text x="1246" y="1943" class="body" text-anchor="start"><tspan x="1246" dy="0">无训练轨迹比较</tspan></text>
<rect x="70" y="1961" width="1660" height="49" class="table-alt"/>
<line x1="70" y1="1961" x2="1730" y2="1961" class="grid"/>
<text x="86" y="1992" class="body-strong" text-anchor="start"><tspan x="86" dy="0">2 · Inference works</tspan></text>
<text x="386" y="1992" class="body" text-anchor="start"><tspan x="386" dy="0">adapter ↔ merged 4/4</tspan></text>
<text x="826" y="1992" class="body" text-anchor="start"><tspan x="826" dy="0">冻结 smoke conversion parity</tspan></text>
<text x="1246" y="1992" class="body" text-anchor="start"><tspan x="1246" dy="0">不是 optimizer resume</tspan></text>
<line x1="70" y1="2010" x2="1730" y2="2010" class="grid"/>
<text x="86" y="2041" class="body-strong" text-anchor="start"><tspan x="86" dy="0">3 · Fresh continuation</tspan></text>
<text x="386" y="2041" class="body" text-anchor="start"><tspan x="386" dy="0">Day 18 Megatron 3→5</tspan></text>
<text x="826" y="2041" class="body" text-anchor="start"><tspan x="826" dy="0">另一训练栈可继续更新</tspan></text>
<text x="1246" y="2041" class="body" text-anchor="start"><tspan x="1246" dy="0">没有 target LoRA comparator</tspan></text>
<rect x="70" y="2059" width="1660" height="49" class="table-alt"/>
<line x1="70" y1="2059" x2="1730" y2="2059" class="grid"/>
<text x="86" y="2090" class="body-strong" text-anchor="start"><tspan x="86" dy="0">4 · Trajectory parity</tspan></text>
<text x="386" y="2090" class="body" text-anchor="start"><tspan x="386" dy="0">not run</tspan></text>
<text x="826" y="2090" class="body" text-anchor="start"><tspan x="826" dy="0">尚无</tspan></text>
<text x="1246" y="2090" class="body" text-anchor="start"><tspan x="1246" dy="0">Run A/B step 21–40</tspan></text>
<line x1="70" y1="2108" x2="1730" y2="2108" class="grid"/>
<text x="86" y="2139" class="body-strong" text-anchor="start"><tspan x="86" dy="0">5 · Bitwise exact</tspan></text>
<text x="386" y="2139" class="body" text-anchor="start"><tspan x="386" dy="0">not claimed</tspan></text>
<text x="826" y="2139" class="body" text-anchor="start"><tspan x="826" dy="0">尚无</tspan></text>
<text x="1246" y="2139" class="body" text-anchor="start"><tspan x="1246" dy="0">kernel determinism + tensor diff</tspan></text>
  <text x="70" y="2193" class="small" text-anchor="start"><tspan x="70" dy="0">Day 11 的 0.6B full-SFT 6-step vs 3+3 exact probe证明过方法；Day 18 证明 fresh continuation；两者都不能跨 lineage / runtime 替代 Qwen3.5 HF LoRA Run A/B。</tspan><tspan x="70" dy="26">当前最诚实的结论是：state inventory 与实验设计 ready，runtime comparator 未执行，exactness 等级未授予。</tspan></text>

  <rect x="40" y="2360" width="1110" height="405" rx="18" class="decision"/>
  <text x="70" y="2404" class="section">4 · 决策 / Takeaway</text>
  <text x="70" y="2450" class="body-strong" text-anchor="start"><tspan x="70" dy="0">Day 17 的学习目标已被明确成一份可执行的 continuity contract；真正实验保留为 Optional R。</tspan><tspan x="70" dy="31">它不再阻塞 S1，因为 promotion 依赖的是 checkpoint integrity、fixed-suite qualification 与 export parity；</tspan><tspan x="70" dy="31">但任何“训练可以无缝恢复”的强 claim 都必须等 Run A/B 证据，而不能引用 load 成功。</tspan><tspan x="70" dy="31">若未来出现 loss 跳变、LR 错位或数据重复，才按同一单卡 topology 执行 Optional R。</tspan><tspan x="70" dy="31">一句话记忆：resume 的问题不是‘文件能否打开’，而是‘下一次 update 是否还是同一个 update’。</tspan></text>
