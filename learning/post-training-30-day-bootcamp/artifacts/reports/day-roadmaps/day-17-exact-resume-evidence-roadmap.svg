  <title id="title">Day 17 · Exact Resume：Checkpoint 能加载，不等于轨迹连续</title>
  <desc id="desc">A Chinese roadmap separating checkpoint loadability, generation, fresh-process continuation, uninterrupted-versus-resumed trajectory parity and bitwise exactness, while clearly marking the Qwen3.5 LoRA Run A and Run B experiment as optional and not executed.</desc>
