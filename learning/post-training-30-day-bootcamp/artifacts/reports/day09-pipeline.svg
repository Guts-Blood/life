<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3900" viewBox="0 0 1800 3900" role="img" aria-labelledby="title desc">
  <title id="title">Day 09 Data Quality, Mixture, and Lineage Pipeline</title>
  <desc id="desc">A complete visual summary of the Day 09 data pipeline, from four training sources and four evaluation sources through schema normalization, length filtering, quality review, exact and near-duplicate handling, decontamination, clean-pool freezing, token-budget planning, mixture construction, and reproducibility validation.</desc>
  <defs>
    <linearGradient id="headerGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15283f"/>
      <stop offset="1" stop-color="#234d65"/>
    </linearGradient>
    <linearGradient id="mixAGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7f6ef"/>
      <stop offset="1" stop-color="#f7fcfa"/>
    </linearGradient>
    <linearGradient id="mixBGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9effc"/>
      <stop offset="1" stop-color="#f8faff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17324a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L12,7 L1,13 Z" fill="#648092"/>
    </marker>
    <style>
      text { font-family: Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #183247; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 3px; fill: #9bd9d0; }
      .title { font-size: 58px; font-weight: 760; fill: #ffffff; }
      .subtitle { font-size: 25px; font-weight: 430; fill: #d8e5ed; }
      .section { font-size: 23px; font-weight: 760; letter-spacing: 2px; fill: #567184; }
      .metric { font-size: 34px; font-weight: 760; fill: #173a4f; }
      .metric-label { font-size: 18px; font-weight: 600; fill: #60798a; }
      .box-title { font-size: 29px; font-weight: 760; fill: #17384e; }
      .box-subtitle { font-size: 19px; font-weight: 520; fill: #647d8e; }
      .body { font-size: 20px; font-weight: 480; fill: #345267; }
      .small { font-size: 17px; font-weight: 480; fill: #647d8e; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 16px; font-weight: 580; fill: #466477; }
      .step { font-size: 18px; font-weight: 760; letter-spacing: 1.2px; fill: #17766e; }
      .pill { font-size: 17px; font-weight: 720; }
      .flow { fill: none; stroke: #648092; stroke-width: 5; marker-end: url(#arrow); }
      .flow-dashed { fill: none; stroke: #a2853e; stroke-width: 4; stroke-dasharray: 12 10; marker-end: url(#arrow); }
      .card { fill: #ffffff; stroke: #d6e0e7; stroke-width: 2; }
      .stage { fill: #ffffff; stroke: #cfdce4; stroke-width: 2; }
      .divider { stroke: #d8e2e8; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="3900" fill="#f4f7fa"/>

  <!-- Header -->
  <rect width="1800" height="330" fill="url(#headerGradient)"/>
  <circle cx="1580" cy="55" r="210" fill="#56b6a9" opacity="0.10"/>
  <circle cx="1690" cy="260" r="155" fill="#f1bd63" opacity="0.08"/>
  <text x="90" y="75" class="eyebrow">POST-TRAINING BOOTCAMP · DAY 09</text>
  <text x="90" y="155" class="title">Data Quality · Mixture · Lineage Pipeline</text>
  <text x="90" y="205" class="subtitle">从原始样本到可追溯的 clean parent pool，再到等 supervised-token 的 A/B 训练配方</text>
  <rect x="90" y="245" width="367" height="48" rx="24" fill="#3a756e"/>
  <circle cx="120" cy="269" r="8" fill="#a9f0d8"/>
  <text x="140" y="276" class="pill" fill="#ffffff">COMPLETE · GATE C WAIVED</text>
  <text x="1680" y="276" text-anchor="end" class="small" fill="#c9dae4">Frozen 2026-08-05</text>

  <!-- Headline metrics -->
  <g filter="url(#shadow)">
    <rect x="90" y="365" width="1620" height="142" rx="24" class="card"/>
  </g>
  <line x1="495" y1="392" x2="495" y2="480" class="divider"/>
  <line x1="900" y1="392" x2="900" y2="480" class="divider"/>
  <line x1="1305" y1="392" x2="1305" y2="480" class="divider"/>
  <text x="292" y="432" text-anchor="middle" class="metric">8,000</text>
  <text x="292" y="468" text-anchor="middle" class="metric-label">canonical candidates</text>
  <text x="697" y="432" text-anchor="middle" class="metric">7,860</text>
  <text x="697" y="468" text-anchor="middle" class="metric-label">clean parent records</text>
  <text x="1102" y="432" text-anchor="middle" class="metric">2,774,246</text>
  <text x="1102" y="468" text-anchor="middle" class="metric-label">clean supervised tokens</text>
  <text x="1507" y="432" text-anchor="middle" class="metric">246,936</text>
  <text x="1507" y="468" text-anchor="middle" class="metric-label">common A/B token budget</text>

  <!-- Inputs -->
  <text x="90" y="575" class="section">01 · INPUTS / 输入</text>
  <g filter="url(#shadow)">
    <rect x="90" y="610" width="1050" height="352" rx="26" class="card"/>
    <rect x="1175" y="610" width="535" height="352" rx="26" fill="#fffaf0" stroke="#e5d7ae" stroke-width="2"/>
  </g>
  <text x="130" y="664" class="box-title">Training sources</text>
  <text x="130" y="696" class="box-subtitle">固定 revision / license / split，分层抽样 4 × 2,000</text>
  <g>
    <rect x="130" y="735" width="226" height="142" rx="18" fill="#edf5fb" stroke="#cadce8"/>
    <circle cx="160" cy="770" r="10" fill="#4e8db4"/>
    <text x="182" y="778" class="body" font-weight="700">General</text>
    <text x="160" y="819" class="small">Tulu · general</text>
    <text x="160" y="850" class="metric" font-size="27">2,000</text>

    <rect x="376" y="735" width="226" height="142" rx="18" fill="#f3edfb" stroke="#d8c9e8"/>
    <circle cx="406" cy="770" r="10" fill="#8b68b3"/>
    <text x="428" y="778" class="body" font-weight="700">Math</text>
    <text x="406" y="819" class="small">Tulu · math</text>
    <text x="406" y="850" class="metric" font-size="27">2,000</text>

    <rect x="622" y="735" width="226" height="142" rx="18" fill="#eaf7f1" stroke="#c8e2d6"/>
    <circle cx="652" cy="770" r="10" fill="#48a17e"/>
    <text x="674" y="778" class="body" font-weight="700">Code</text>
    <text x="652" y="819" class="small">Tulu · code</text>
    <text x="652" y="850" class="metric" font-size="27">2,000</text>

    <rect x="868" y="735" width="226" height="142" rx="18" fill="#fff1e8" stroke="#ebd1bf"/>
    <circle cx="898" cy="770" r="10" fill="#c47a45"/>
    <text x="920" y="778" class="body" font-weight="700">Finance</text>
    <text x="898" y="819" class="small">FinQA · finance</text>
    <text x="898" y="850" class="metric" font-size="27">2,000</text>
  </g>
  <rect x="130" y="900" width="964" height="35" rx="17" fill="#eef4f7"/>
  <text x="612" y="924" text-anchor="middle" class="small">Day 08 frozen contract：chat template · tokenizer · masking policy</text>

  <text x="1215" y="664" class="box-title">Held-out eval sources</text>
  <text x="1215" y="696" class="box-subtitle">仅用于 Step 8–9 contamination scan</text>
  <g>
    <rect x="1215" y="735" width="210" height="72" rx="16" fill="#ffffff" stroke="#e3d6af"/>
    <text x="1240" y="768" class="body" font-weight="700">MMLU</text>
    <text x="1400" y="788" text-anchor="end" class="small">40</text>
    <rect x="1460" y="735" width="210" height="72" rx="16" fill="#ffffff" stroke="#e3d6af"/>
    <text x="1485" y="768" class="body" font-weight="700">GSM8K</text>
    <text x="1645" y="788" text-anchor="end" class="small">40</text>
    <rect x="1215" y="825" width="210" height="72" rx="16" fill="#ffffff" stroke="#e3d6af"/>
    <text x="1240" y="858" class="body" font-weight="700">HumanEval</text>
    <text x="1400" y="878" text-anchor="end" class="small">40</text>
    <rect x="1460" y="825" width="210" height="72" rx="16" fill="#ffffff" stroke="#e3d6af"/>
    <text x="1485" y="858" class="body" font-weight="700">TAT-QA</text>
    <text x="1645" y="878" text-anchor="end" class="small">40</text>
  </g>
  <text x="1442" y="931" text-anchor="middle" class="metric-label">160 eval candidates</text>

  <!-- Main pipeline -->
  <text x="90" y="1055" class="section">02 · CLEAN PARENT POOL / 质量与去重流水线</text>
  <path d="M615 962 L615 1095" class="flow"/>
  <path d="M1442 962 L1650 1020 L1650 1960 L1530 1960" class="flow-dashed"/>
  <text x="1668" y="1450" transform="rotate(90 1668 1450)" class="small" fill="#967730">held-out route</text>

  <!-- Step 1-2 -->
  <g filter="url(#shadow)">
    <rect x="210" y="1100" width="1320" height="188" rx="25" class="stage"/>
  </g>
  <rect x="210" y="1100" width="18" height="188" rx="9" fill="#2d8e86"/>
  <text x="266" y="1148" class="step">STEPS 1–2</text>
  <text x="266" y="1192" class="box-title">Download → canonical schema → deterministic sample</text>
  <text x="266" y="1230" class="body">统一 messages、source / revision / license、skill 标签与 lineage。</text>
  <rect x="1110" y="1140" width="360" height="94" rx="18" fill="#edf7f5"/>
  <text x="1290" y="1178" text-anchor="middle" class="metric">8,000</text>
  <text x="1290" y="1212" text-anchor="middle" class="metric-label">schema-valid candidates</text>
  <text x="266" y="1263" class="mono">parent_id → canonical sample_id → downstream occurrence_id</text>

  <path d="M870 1288 L870 1370" class="flow"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="210" y="1375" width="1320" height="188" rx="25" class="stage"/>
  </g>
  <rect x="210" y="1375" width="18" height="188" rx="9" fill="#4c87ad"/>
  <text x="266" y="1423" class="step" fill="#4c7895">STEP 3 · RULE-BASED FILTER</text>
  <text x="266" y="1467" class="box-title">Encode for measurement · max_length = 2,048</text>
  <text x="266" y="1505" class="body">校验 schema / template / supervision / token-length；只持久化 text + metadata。</text>
  <rect x="1105" y="1415" width="365" height="102" rx="18" fill="#eef5fa"/>
  <text x="1288" y="1454" text-anchor="middle" class="metric">8,000 → 7,864</text>
  <text x="1288" y="1490" text-anchor="middle" class="metric-label">accepted · 136 rejected</text>
  <text x="266" y="1539" class="mono">input_ids / attention_mask / assistant_mask / labels = transient audit tensors</text>

  <path d="M870 1563 L870 1645" class="flow"/>

  <!-- Steps 4-5 -->
  <g filter="url(#shadow)">
    <rect x="210" y="1650" width="1320" height="188" rx="25" class="stage"/>
  </g>
  <rect x="210" y="1650" width="18" height="188" rx="9" fill="#8b68b3"/>
  <text x="266" y="1698" class="step" fill="#76579b">STEPS 4–5 · QUALITY AUDIT + DECISION LEDGER</text>
  <text x="266" y="1742" class="box-title">Token distribution audit + Gate A review</text>
  <text x="266" y="1780" class="body">检查 supervised-token 占比、异常样本与分层样本；确认拒绝项后才应用删除。</text>
  <rect x="1105" y="1690" width="365" height="102" rx="18" fill="#f3eef9"/>
  <text x="1288" y="1729" text-anchor="middle" class="metric">40 / 40</text>
  <text x="1288" y="1765" text-anchor="middle" class="metric-label">Gate A accept · 0 removed</text>
  <text x="266" y="1814" class="mono">rule signal ≠ rejection · review decision is recorded and replayable</text>

  <path d="M870 1838 L870 1920" class="flow"/>

  <!-- Step 6 -->
  <g filter="url(#shadow)">
    <rect x="210" y="1925" width="1320" height="188" rx="25" class="stage"/>
  </g>
  <rect x="210" y="1925" width="18" height="188" rx="9" fill="#cb7540"/>
  <text x="266" y="1973" class="step" fill="#a85a2d">STEP 6 · EXACT DEDUP</text>
  <text x="266" y="2017" class="box-title">Normalized complete-record hash groups</text>
  <text x="266" y="2055" class="body">NFKC + lowercase + collapse whitespace；complete record exact match 才触发自动去重。</text>
  <rect x="1105" y="1965" width="365" height="102" rx="18" fill="#fff2ea"/>
  <text x="1288" y="2004" text-anchor="middle" class="metric">7,864 → 7,860</text>
  <text x="1288" y="2040" text-anchor="middle" class="metric-label">4 exact duplicates removed</text>
  <text x="266" y="2089" class="mono">prompt-only / answer-only match = risk evidence, not terminal deletion</text>

  <path d="M870 2113 L870 2195" class="flow"/>

  <!-- Step 7 -->
  <g filter="url(#shadow)">
    <rect x="210" y="2200" width="1320" height="188" rx="25" class="stage"/>
  </g>
  <rect x="210" y="2200" width="18" height="188" rx="9" fill="#d0a13a"/>
  <text x="266" y="2248" class="step" fill="#9b7627">STEP 7 · NEAR-DUPLICATE CANDIDATES</text>
  <text x="266" y="2292" class="box-title">RapidFuzz ratio ≥ 90 · min 80 chars</text>
  <text x="266" y="2330" class="body">只产生 candidate，不自动删；20 个分层 pairs 人工 review。</text>
  <rect x="1050" y="2240" width="420" height="102" rx="18" fill="#fff8e9"/>
  <text x="1260" y="2279" text-anchor="middle" class="metric">1,129 / 812</text>
  <text x="1260" y="2315" text-anchor="middle" class="metric-label">field candidates / unique pairs</text>
  <text x="266" y="2364" class="mono">812 keep_both · 0 removals · 663 unique samples involved</text>

  <path d="M870 2388 L870 2470" class="flow"/>

  <!-- Step 8-9 -->
  <g filter="url(#shadow)">
    <rect x="210" y="2475" width="1320" height="188" rx="25" class="stage"/>
  </g>
  <rect x="210" y="2475" width="18" height="188" rx="9" fill="#a2853e"/>
  <text x="266" y="2523" class="step" fill="#8a6e2f">STEPS 8–9 · EVAL INGEST + DECONTAMINATION</text>
  <text x="266" y="2567" class="box-title">Train ↔ eval overlap scan</text>
  <text x="266" y="2605" class="body">160 条 held-out eval 进入独立索引；exact 与 near overlap 分开报告并保留证据。</text>
  <rect x="1050" y="2515" width="420" height="102" rx="18" fill="#fff8e9"/>
  <text x="1260" y="2554" text-anchor="middle" class="metric">0 exact · 0 near</text>
  <text x="1260" y="2590" text-anchor="middle" class="metric-label">0 contamination removals</text>
  <text x="266" y="2639" class="mono">matching conclusion is scoped to frozen fields, normalization, and threshold</text>

  <path d="M870 2663 L870 2745" class="flow"/>

  <!-- Step 10 -->
  <g filter="url(#shadow)">
    <rect x="210" y="2750" width="1320" height="200" rx="25" fill="#eaf6f3" stroke="#83b8ae" stroke-width="3"/>
  </g>
  <rect x="210" y="2750" width="18" height="200" rx="9" fill="#247b71"/>
  <text x="266" y="2798" class="step">STEP 10 · FREEZE CLEAN PARENT POOL</text>
  <text x="266" y="2842" class="box-title">Single canonical source of truth for both mixtures</text>
  <text x="266" y="2880" class="body">应用所有已确认决策，重算分布并冻结 lineage hashes。</text>
  <rect x="1020" y="2790" width="450" height="112" rx="18" fill="#ffffff" stroke="#b8d8d2"/>
  <text x="1245" y="2831" text-anchor="middle" class="metric">7,860 records</text>
  <text x="1245" y="2867" text-anchor="middle" class="metric-label">2,774,246 supervised tokens</text>
  <text x="266" y="2921" class="mono">manifest → source revision + parent_id + transforms + decision ledgers + hashes</text>

  <!-- Budget and mixtures -->
  <path d="M870 2950 L870 3030" class="flow"/>
  <rect x="420" y="3035" width="960" height="104" rx="24" fill="#203f54" filter="url(#shadow)"/>
  <text x="900" y="3075" text-anchor="middle" class="step" style="fill:#9bd9d0">STEP 11 · COMMON SUPERVISED-TOKEN BUDGET</text>
  <text x="900" y="3115" text-anchor="middle" font-size="29" font-weight="760" style="fill:#ffffff">246,936 tokens · finance bottleneck · 8.90% of clean pool</text>
  <path d="M900 3139 L900 3175 L475 3175 L475 3210" class="flow"/>
  <path d="M900 3139 L900 3175 L1325 3175 L1325 3210" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="90" y="3215" width="770" height="240" rx="26" fill="url(#mixAGradient)" stroke="#94c9b7" stroke-width="3"/>
    <rect x="940" y="3215" width="770" height="240" rx="26" fill="url(#mixBGradient)" stroke="#9bb1dc" stroke-width="3"/>
  </g>
  <text x="135" y="3265" class="step">STEP 12 · MIX A</text>
  <text x="135" y="3308" class="box-title">Balanced</text>
  <text x="135" y="3345" class="body">General 25% · Math 25% · Code 25% · Finance 25%</text>
  <text x="135" y="3383" class="mono">61,734 × 4 = 246,936 supervised tokens</text>
  <text x="135" y="3420" class="small">2,730 occurrences · 728,317 input tokens · no replacement</text>

  <text x="985" y="3265" class="step" fill="#526fa6">STEP 12 · MIX B</text>
  <text x="985" y="3308" class="box-title">Code-targeted</text>
  <text x="985" y="3345" class="body">General 12.5% · Math 12.5% · Code 50% · Finance 25%</text>
  <text x="985" y="3383" class="mono">30,867 · 30,867 · 123,468 · 61,734</text>
  <text x="985" y="3420" class="small">3,078 occurrences · 833,607 input tokens · no replacement</text>

  <!-- Outputs -->
  <text x="90" y="3535" class="section">03 · FROZEN OUTPUTS / 冻结产物</text>
  <g filter="url(#shadow)">
    <rect x="90" y="3570" width="1620" height="214" rx="26" class="card"/>
  </g>
  <rect x="130" y="3610" width="500" height="58" rx="14" fill="#edf7f5"/>
  <text x="155" y="3648" class="mono">day09-dataset-manifest.json</text>
  <rect x="650" y="3610" width="500" height="58" rx="14" fill="#edf7f5"/>
  <text x="675" y="3648" class="mono">day09-mix-A-balanced.json</text>
  <rect x="1170" y="3610" width="500" height="58" rx="14" fill="#eef3fb"/>
  <text x="1195" y="3648" class="mono">day09-mix-B-targeted.json</text>
  <rect x="130" y="3690" width="760" height="58" rx="14" fill="#fff8e9"/>
  <text x="155" y="3728" class="mono">day09-data-quality-audit.md</text>
  <rect x="910" y="3690" width="760" height="58" rx="14" fill="#fff8e9"/>
  <text x="935" y="3728" class="mono">day09-decontamination-report.md</text>

  <!-- Footer QA strip -->
  <rect x="0" y="3820" width="1800" height="80" fill="#15283f"/>
  <text x="90" y="3855" font-size="18" font-weight="680" style="fill:#d8e5ed">STEP 13 · REPLAY QA  11/11 checks  ·  44 tests  ·  lineage-complete manifests</text>
  <text x="90" y="3882" font-size="16" font-weight="560" style="fill:#9fb7c6">A/B supervised tokens equal; all filtering, dedup, decontamination, sampling and hashes are replayable.</text>
  <text x="1710" y="3866" text-anchor="end" font-size="18" font-weight="700" style="fill:#f3c56f">Residual risk · Gate C 0/60 reviewed</text>
</svg>
